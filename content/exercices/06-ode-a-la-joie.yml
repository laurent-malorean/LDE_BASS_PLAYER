titre: "Ode à la joie (Beethoven)"
origine: "Beethoven, 9e symphonie (1824) — domaine public. Mélodie en Do majeur, jouée sur les cordes de La et de Ré."
niveau: debutant
bpm: 70
chiffrage: "4/4"
consigne: "Une mélodie que tu connais déjà par cœur : mi mi fa sol, sol fa mi ré, do do ré mi, mi. ré ré. Chante-la dans ta tête en jouant."
notes: "D2 D2 D3 D5 | D5 D3 D2 A5 | A3 A3 A5 D2 | D2/1.5 A5/0.5 A5/2 | D2 D2 D3 D5 | D5 D3 D2 A5 | A3 A3 A5 D2 | A5/1.5 A3/0.5 A3/2"
conseils:
  - "Position fixe : index frette 2, majeur frette 3, auriculaire frette 5. Tu ne bouges pas la main."
  - "Les notes sont Mi Mi Fa Sol | Sol Fa Mi Ré | Do Do Ré Mi | Mi. Ré Ré (puis la fin change la deuxième fois)."
  - "Les durées pointées (1.5 puis 0.5) donnent le petit rythme « long-court » de la fin de phrase."
