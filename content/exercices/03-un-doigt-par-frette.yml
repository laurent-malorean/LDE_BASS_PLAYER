titre: Un doigt par frette (1-2-3-4)
niveau: debutant
bpm: 50
chiffrage: "4/4"
consigne: Index frette 1, majeur frette 2, annulaire frette 3, auriculaire frette 4, puis retour. Sur chaque corde.
notes: "E1 E2 E3 E4 | E4 E3 E2 E1 | A1 A2 A3 A4 | A4 A3 A2 A1"
conseils:
  - Les doigts restent proches des cordes et appuient juste derrière la frette.
  - Garde le pouce derrière le manche, la main détendue.
