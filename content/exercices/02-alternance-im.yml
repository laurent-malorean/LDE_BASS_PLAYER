titre: Alternance index / majeur
niveau: debutant
bpm: 60
chiffrage: "4/4"
consigne: Une seule corde, quatre fois la même note, en alternant i m i m. L'objectif est la régularité, pas la vitesse.
notes: "E0 E0 E0 E0 | E0 E0 E0 E0 | A0 A0 A0 A0 | A0 A0 A0 A0"
conseils:
  - Écoute le volume de chaque note, il doit être égal (i et m aussi forts l'un que l'autre).
  - Commence lentement (50 BPM), puis monte de 5 BPM quand tu réussis trois fois de suite.
