titre: "Seven Nation Army (riff)"
origine: "The White Stripes (2003). Suite de notes : mi mi sol mi ré do si, d'après plusieurs tablatures concordantes."
niveau: intermediaire
bpm: 80
chiffrage: "4/4"
doigtes_gauche: aucun
consigne: "Le riff le plus célèbre du rock, sur la corde de La. ATTENTION : le rythme ci-dessous est une approximation. Écoute l'original et corrige le champ « notes » de ce fichier si besoin (durées après le /)."
notes: "A7/1.5 A7/0.5 A10/1.5 A7/0.5 | A5/1 A3/1 A2/2"
conseils:
  - "Il y a des déplacements de main (frettes 7, 10, 5, 3, 2) : c'est pour cela que le doigté de la main gauche n'est pas indiqué, choisis celui qui te convient."
  - "Les différentes tablatures divergent un peu sur la fin du riff (certaines ajoutent ré do avant le si). Fie-toi à l'enregistrement."
  - "Joue-le d'abord très lentement (60 BPM) pour mémoriser les déplacements."
