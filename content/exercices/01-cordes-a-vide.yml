titre: Les cordes à vide
niveau: debutant
bpm: 50
chiffrage: "4/4"
consigne: Joue chaque corde à vide, de la plus grave à la plus aiguë, en alternant index et majeur.
notes: "E0 A0 D0 G0 | G0 D0 A0 E0"
conseils:
  - Laisse bien sonner chaque note avant de passer à la suivante.
  - Le pouce suit : il se pose sur la corde juste en dessous de celle que tu joues.
  - Vérifie que tu n'appuies sur aucune frette (corde à vide).
