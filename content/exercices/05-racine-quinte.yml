titre: Racine et quinte (La)
niveau: debutant
bpm: 65
chiffrage: "4/4"
consigne: "Le motif de base de beaucoup de morceaux : la note racine (La) puis la quinte (Mi, une corde plus aiguë, 2 frettes plus loin)."
notes: "A0 A0 D2 D2 | A0 A0 D2 A0 | D0 D0 G2 G2 | D0 D0 G2 D0"
conseils:
  - "D2 est un Mi ; G2 est un La. La quinte est toujours « une corde plus aiguë, deux frettes plus loin »."
