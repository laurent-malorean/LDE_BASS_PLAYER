titre: "Au clair de la lune"
origine: "Chanson traditionnelle française — domaine public. Début du premier couplet, en Do majeur."
niveau: debutant
bpm: 65
chiffrage: "4/4"
consigne: "Do do do ré | mi (2 temps) ré (2 temps) | do mi ré ré | do (4 temps). Le but : tenir les notes longues sans te précipiter."
notes: "A3 A3 A3 A5 | D2/2 A5/2 | A3 D2 A5 A5 | A3/4"
conseils:
  - "Les notes longues (/2 et /4) doivent sonner pendant toute leur durée : compte les temps dans ta tête."
  - "Active le métronome et vérifie que chaque changement de note tombe sur un clic."
